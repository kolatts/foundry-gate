name: Postdeployment Tests (Reusable)

# Reusable workflow_call: runs FoundryGate.Tests.Postdeployment against a deployed environment
# after the app deploys (deploy-all.yml). The run is NOT gating (`continue-on-error`) — it
# reports. #139 makes it gating once the Playwright scenarios exist.
#
# The tests receive the live URLs through environment variables read from the infra outputs:
#   FG_API_BASE_URL   https://<container app fqdn>
#   FG_UI_BASE_URL    https://<static web app hostname>
#
# The unauthenticated half of ApiAuthenticationTests (#102) runs here on FG_API_BASE_URL alone.
# The 403/200 half needs delegated Entra tokens (FG_ADMIN_TOKEN / FG_NONADMIN_TOKEN) and reports
# as *skipped* without them — a CI principal signs in with OIDC as an application and cannot mint
# a user token, and an access token expires in an hour, so there is nothing durable to store. Run
# that half from a developer machine per docs reference/owner-setup.md.

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub Environment name: dev | production."
        required: true
        type: string
    outputs:
      summary:
        description: "e.g. '1/1 passed'"
        value: ${{ jobs.test.outputs.summary }}

env:
  DEPLOYMENT_NAME: foundrygate-${{ inputs.environment == 'production' && 'prod' || inputs.environment }}

jobs:
  test:
    name: Postdeployment tests (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: ./.github/actions/azure-oidc-login
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          environment: ${{ inputs.environment }}

      - name: Resolve infra outputs
        id: infra
        run: bash .github/scripts/infra/export-outputs.sh "$DEPLOYMENT_NAME"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build tests
        run: dotnet build src/FoundryGate.Tests.Postdeployment --configuration Release

      - name: Wait for the API to answer
        env:
          API: https://${{ steps.infra.outputs.container-app-fqdn }}
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -m 15 -o /dev/null -w '%{http_code}' "${API}/health" || true)
            echo "attempt $i: ${API}/health -> ${code}"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "::warning::API did not answer /health with 200 in 5 minutes; running the tests anyway."

      # The tests really run; only the gating is deferred. `continue-on-error` keeps a failure
      # from failing the chain, and `steps.test.outcome` carries the truth into the summary so
      # nobody reads "1/1 passed" as "the stack is verified".
      - name: Run postdeployment tests (reporting only — #139 makes this gating)
        id: test
        continue-on-error: true
        env:
          FG_API_BASE_URL: https://${{ steps.infra.outputs.container-app-fqdn }}
          FG_UI_BASE_URL: https://${{ steps.infra.outputs.static-web-app-hostname }}
        run: |
          dotnet test src/FoundryGate.Tests.Postdeployment --configuration Release --no-build \
            --logger "trx;LogFileName=postdeployment.trx" --results-directory TestResults

      - name: Summarise
        id: summary
        if: always()
        env:
          OUTCOME: ${{ steps.test.outcome }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          API: https://${{ steps.infra.outputs.container-app-fqdn }}
          UI: https://${{ steps.infra.outputs.static-web-app-hostname }}
        run: |
          trx=TestResults/postdeployment.trx
          if [ -f "$trx" ]; then
            total=$(grep -oP 'total="\K[^"]+' "$trx" | head -1)
            passed=$(grep -oP 'passed="\K[^"]+' "$trx" | head -1)
            failed=$(grep -oP 'failed="\K[^"]+' "$trx" | head -1)
            summary="${passed:-0}/${total:-0} passed"
            [ "${failed:-0}" != "0" ] && summary="${summary}, ${failed} FAILED"
          elif [ "$OUTCOME" = "success" ]; then
            summary="ran, but no results file was produced"
          else
            summary="dotnet test did not produce results (${OUTCOME})"
          fi
          # Say what actually happened, including when the step itself failed.
          summary="${summary} [dotnet test: ${OUTCOME}]"
          echo "summary=${summary}" >> "$GITHUB_OUTPUT"
          {
            echo "## Postdeployment tests — ${TARGET_ENVIRONMENT}"
            echo ""
            echo "- \`dotnet test\` outcome: **${OUTCOME}**"
            echo "- Result: **${summary}**"
            echo "- Coverage today is the unauthenticated 401 contract plus the scaffold smoke test; the token-gated 403/200 assertions report as **skipped** here (no user token in CI). The result is **not gating** — a green line does NOT mean the stack is verified (#139)."
            echo "- API: ${API}"
            echo "- UI: ${UI}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postdeployment-results-${{ inputs.environment }}
          path: TestResults
          retention-days: 14
          if-no-files-found: ignore
