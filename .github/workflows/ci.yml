name: CI

on:
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Required status check for branch protection — runs on EVERY PR (no path
  # filter: a required check that never runs would block unrelated PRs forever).
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build (warnings are errors)
        run: dotnet build FoundryGate.sln --configuration Release

      - name: Predeployment tests
        run: dotnet test src/FoundryGate.Tests.Predeployment --configuration Release --no-build --logger "trx;LogFileName=predeployment.trx" --results-directory TestResults

      - name: Format check
        run: dotnet format FoundryGate.sln --verify-no-changes

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

  # Docs build sanity on PRs that touch the site (not a required check). The path filter
  # also covers the GENERATOR's inputs (docs-site/scripts/generate-architecture.mjs, #221)
  # — infra/, the two src/ projects it reads and the csproj graph — because a Bicep or
  # Functions change with no docs edit is exactly the case where the committed
  # architecture model would go stale. It deliberately does NOT cover all of src/: a
  # change to Core/Data/Domain/Web alone cannot move the model, and would only buy every
  # .NET PR an npm ci plus an Astro build.
  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect docs changes
        id: docs
        shell: bash
        # base_ref via env, not inline expansion: a branch name is attacker-influenced text.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git fetch origin "$BASE_REF" --depth=1 && \
             git diff --quiet "origin/$BASE_REF"...HEAD -- \
               docs-site/ content/ infra/ \
               src/FoundryGate.Functions/ src/FoundryGate.Api/ 'src/*/*.csproj'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.docs.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build docs site
        if: steps.docs.outputs.changed == 'true'
        working-directory: docs-site
        run: |
          npm ci
          npm run build

      # `npm run build` regenerates src/generated via prebuild; if that moved the committed
      # model, the PR changed the architecture without updating the diagram. `git status`
      # rather than `git diff` so a NEW generated file (untracked, therefore invisible to
      # diff) fails too.
      - name: Architecture model is up to date
        if: steps.docs.outputs.changed == 'true'
        run: |
          if [ -n "$(git status --porcelain -- docs-site/src/generated)" ]; then
            git status --porcelain -- docs-site/src/generated
            git diff -- docs-site/src/generated
            echo "::error::The architecture model is stale. Run 'npm run generate:architecture' in docs-site/ and commit docs-site/src/generated."
            exit 1
          fi
